<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .contact-card {
            width: 80%;
            margin: 40px auto;
            border: 2px solid #d0d0d0;
            border-radius: 25px;
            padding: 20px;
            background-color: white;
        }

        .contact-image {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }

        .contact-info {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 20px;
        }

        .contact-icon {
            width: 140px;
            height: 140px;
        }

        .contact-details {
            text-align: center;
            color: #4c6ef5;
            font-weight: 600;
        }

        .contact-details p {
            margin-bottom: 8px;
        }
    </style>
</head>

<body style="background-color:#f4f4f4">

    <nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise; height: 1in;">
        <div class="container-fluid">
          <h2 style="padding-right: 5%;">Dealerships</h2>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarText">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" style="font-size: larger;" aria-current="page" href="/">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" style="font-size: larger;" href="/about">About Us</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" style="font-size: larger;" href="/contact">Contact Us</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

<div class="contact-card">
    
    <img src="/static/cars.jpeg"
    class="contact-image"
    style="width:70%; display:block; margin:auto;">

    <div class="contact-info">

        <div>
            <img
                src="/static/contactus.png"
                class="contact-icon"
                alt="Contact">
        </div>

        <div class="contact-details">
            <p>Customer Service</p>
            <p>support@bestcars.com</p>

            <p>Advertising Team</p>
            <p>marketing@bestcars.com</p>

            <p>Public Relations</p>
            <p>pr@bestcars.com</p>

            <p>Phone</p>
            <p>+1 (555) 123-4567</p>

            <p>Website</p>
            <p>www.bestcars.com</p>
        </div>

    </div>

</div>

</body>
</html>
